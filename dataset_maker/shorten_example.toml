# Example config for seqence_shortener.py
#
#   python dataset_maker/seqence_shortener.py dataset_maker/shorten_example.toml
#
# Relative paths are resolved against the directory holding this file.

input_dir  = "../data/camus-dataset/n50"
output_dir = "../data/shortened"

# One dataset is written per length, at <output_dir>/<length>/<relative path>.
lengths = [100, 200]

# Operations applied to every file, in order, for each length.
# Built in: "truncate" (keep the first <length> sites).
#
# To add your own, register it in STEPS (see the docstring at the top of
# seqence_shortener.py) and name it here, with options if it needs any:
#
#   steps = ["truncate", {action = "drop_taxa", taxa = ["t5", "t12"]}]
#
steps = ["truncate"]
